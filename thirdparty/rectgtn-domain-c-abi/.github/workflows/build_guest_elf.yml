# Build the RECTGTN domain guest ELF for the RISC-V Linux sandbox.
#
# Mirrors 4-entities/godot-sandbox/.github/workflows/build_gdscript_elf.yml
# (BSD-3-Clause, recipe reused with attribution) so the guest-ELF build and
# artifact shape match what the taskweft host (opentelemetry-godot-project)
# expects: a stripped (with --strip-debug, NOT --strip-all, so the host can
# still read the guest API from .symtab) RISC-V64 Linux ELF that emits the
# `.sandbox_variant` section (SBXV magic + 4-byte little-endian Variant size)
# and exposes the rectgtn_* C-ABI symbols from api/rectgtn_api.h.
#
# RFD 66606-2153: this is the green CI for the C-ABI host; the archived
# FBD repo's `build_fbd_elf.yml` runs `cmake -S riscv_ci/` which was never
# committed, so that workflow is red.

name: Build RECTGTN Guest ELF

on:
  workflow_call:
    inputs:
      double_precision:
        type: boolean
        required: true
        default: true
  workflow_dispatch:
    inputs:
      double_precision:
        type: boolean
        required: false
        default: true
  push:
    paths:
      - guest/**
      - cmake/**
      - .github/workflows/build_guest_elf.yml

jobs:
  build:
    runs-on: ubuntu-26.04
    name: Build ${{ matrix.elf }}
    strategy:
      matrix:
        include:
          # Default: double-precision (40-byte Variant), matching
          # 2-contract/guest-runtime/cmake/guest_runtime.cmake which
          # forces DOUBLE_PRECISION=ON, and the opentelemetry host's
          # `--variant-size=40` gate.
          - elf: rectgtn.elf
            double_precision: ON
            variant_size: 40
            artifact: rectgtn-guest-elf
          # Single-precision (24-byte Variant).
          - elf: rectgtn.single.elf
            double_precision: OFF
            variant_size: 24
            artifact: rectgtn-guest-elf-single

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install RISC-V cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-14-riscv64-linux-gnu \
            cmake

      - name: Configure
        env:
          CC: riscv64-linux-gnu-gcc-14
          CXX: riscv64-linux-gnu-g++-14
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/guest/toolchain.cmake \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DSTRIPPED=ON \
            -DDOUBLE_PRECISION=${{ matrix.double_precision }} \
            -S guest

      - name: Build
        run: cmake --build build --parallel 4

      - name: Rename artifact
        run: mv build/rectgtn build/${{ matrix.elf }}

      - name: Verify ELF
        run: |
          file build/${{ matrix.elf }}
          riscv64-linux-gnu-objcopy -O binary --only-section=.sandbox_variant build/${{ matrix.elf }} variant.bin
          python3 - variant.bin ${{ matrix.variant_size }} <<'EOF'
          import struct, sys
          data = open(sys.argv[1], "rb").read()
          if data[:4] != b"SBXV":
              sys.exit(f"no .sandbox_variant marker: {data[:8]!r}")
          size = struct.unpack("<I", data[4:8])[0]
          print(f".sandbox_variant: {size}-byte Variant")
          if size != int(sys.argv[2]):
              sys.exit(f"expected a {sys.argv[2]}-byte Variant")
          EOF

      - name: Verify rectgtn_* symbols in .symtab
        run: |
          riscv64-linux-gnu-objdump -R build/${{ matrix.elf }} 2>/dev/null || riscv64-linux-gnu-objdump -t build/${{ matrix.elf }} | grep -q rectgtn_
          # The host resolves guest functions by symbol name (see 4-entities/
          # godot-sandbox src/sandbox.cpp `sb.has_function`); after
          # --strip-debug (STRIPPED=ON) those names must still be present.
          for f in rectgtn_version rectgtn_plan rectgtn_replan rectgtn_domain_compose; do
            riscv64-linux-gnu-objdump -t build/${{ matrix.elf }} | grep -q "rectgtn_${f}" || { echo "missing $f in .symtab"; exit 1; }
          done
          echo "all rectgtn_* functions resolvable by name"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: build/${{ matrix.elf }}
          if-no-files-found: error
