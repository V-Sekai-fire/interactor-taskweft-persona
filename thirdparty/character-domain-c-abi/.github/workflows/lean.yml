# The Lean build and the self-test gate: the character domain core must build,
# and the witness must pass -- the green gate. Mirrors the RECTGTN domain's
# `lean.yml` (elan + lake build + witness exes).
#
# The union with RECTGTN is pulled from GitHub by `lakefile.lean`'s
# `require «taskweft» ... @ "main"`, so this build also proves the two domains
# compose.

name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-26.04
    name: Lean core + self-test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean via elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain=leanprover/lean4:v4.34.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: lake build
        run: lake build

      - name: Run the witness gate
        # Green gate: the witness must exit 0 and print "OK:". A refusal exits
        # non-zero and fails the workflow.
        run: lake exe character_witness
