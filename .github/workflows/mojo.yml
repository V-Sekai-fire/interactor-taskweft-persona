# The Mojo port of the persona: its gates, and Lean as the oracle.
#
# gates: the witness-ladder tests and the planted-bug run for the core, on Mojo 1.3
# (mojo/pixi.toml pins the nightly).
# parity: the same inputs through the Lean build and the Mojo build; the answers must match.
# guest: persona.elf from the Mojo, linked for riscv64, loaded in a pinned double-precision Godot and called.
# mutants-jsonld: 18 planted bugs in the planner, run by hand (about half an hour).

name: Mojo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mojo
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          manifest-path: mojo/pixi.toml
          locked: true
          cache: false
      - name: Core, grid and guest surface
        run: pixi run test
      - name: Planner properties
        run: pixi run test-props
      - name: JSON-LD planner, KHR graphs and the cases under tests/
        run: pixi run test-jsonld
      - name: Planted bugs in the core
        run: pixi run mutants

  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Lean from elan, at the release the repo pins
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain="$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: The Lean oracle
        run: lake build persona persona_plan Persona.Grid
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          manifest-path: mojo/pixi.toml
          locked: true
          cache: false
      - name: Skill grids, 1505 specs
        working-directory: mojo
        run: pixi run parity
      - name: Plan documents, 397 pairs
        working-directory: mojo
        run: pixi run parity-plan
      - name: The ask surface prints what Lean prints
        run: |
          (cd mojo && pixi run ask) > "$RUNNER_TEMP/ask.mojo"
          (cd mojo && pixi run vocabulary) > "$RUNNER_TEMP/vocab.mojo"
          lake exe persona > "$RUNNER_TEMP/ask.lean"
          lake exe persona --vocabulary > "$RUNNER_TEMP/vocab.lean"
          diff "$RUNNER_TEMP/ask.lean" "$RUNNER_TEMP/ask.mojo"
          diff "$RUNNER_TEMP/vocab.lean" "$RUNNER_TEMP/vocab.mojo"

  guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: The riscv64 sysroot the guest links against
        run: git clone -q --depth 1 https://github.com/V-Sekai-fire/repository-riscv64-sysroot "$RUNNER_TEMP/riscv64-sysroot"
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          manifest-path: mojo/pixi.toml
          locked: true
          cache: false
      - name: persona.elf, built from the Mojo
        working-directory: mojo
        env:
          SYSROOT_REPO: ${{ runner.temp }}/riscv64-sysroot
        run: pixi run build-guest
      - name: It loads in Godot and answers what Lean answers, with controls
        working-directory: mojo
        run: pixi run python ../tools/check_guest.py --elf=guest/build/persona.elf --boxed --work="$RUNNER_TEMP/guest"
      - uses: actions/upload-artifact@v4
        with:
          name: persona-mojo-elf-${{ github.sha }}
          path: mojo/guest/build/persona.elf

  mutants-jsonld:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Lean from elan, at the release the repo pins
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain="$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lake build persona_plan
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          manifest-path: mojo/pixi.toml
          locked: true
          cache: false
      - name: Planted bugs in the planner, KHR runner and time codecs
        working-directory: mojo
        run: pixi run mutants-jsonld
