# persona.elf: the guest the model explorer loads. One artifact per commit,
# `persona-elf-<sha>`, which the viewer's release pipeline downloads by that
# prefix (`tools/release.exs` @guests).
#
# The body is the persona's Lean, compiled for riscv64 and linked into a
# sandbox-api guest, so the host calls it with Godot's own String (guest/main.cpp).
# Two pieces of workspace machinery build it: contract-guest-runtime (sandbox_api
# and the guest's API registration) and interactor-lean-guest (the Lean runtime
# and Init for riscv64).
#
# The gate here is the ELF a double-precision viewer loads, with a planted
# single-precision control. The translated-vs-interpreted gate is not here yet:
# it needs the add-on to load a guest whose static glibc puts an ifunc trampoline
# outside .text (libriscv's `ignore_text_section`), which godot-sandbox does not
# set. Until that ships, the guest loads and cannot be called, so a bintr gate
# would be red on every push rather than proving anything.

name: guest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  persona-elf:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: weft/3-interactor/taskweft-persona
      - name: Tools from apt
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake ninja-build g++ git python3
      - name: The goal manifest's sibling checkouts
        working-directory: weft
        run: |
          for p in 2-contract/guest-runtime:contract-guest-runtime \
                   3-interactor/lean-guest:interactor-lean-guest \
                   5-repository/riscv64-sysroot:repository-riscv64-sysroot; do
            git clone -q --depth 1 "https://github.com/V-Sekai-fire/${p#*:}" "${p%%:*}"
            echo "${p%%:*} $(git -C "${p%%:*}" rev-parse HEAD)" >> "$RUNNER_TEMP/siblings.txt"
          done
          cat "$RUNNER_TEMP/siblings.txt"
      - name: Lean from elan, at the release the guest's runtime is built from
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain=leanprover/lean4:v4.34.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          manifest-path: weft/5-repository/riscv64-sysroot/pixi.toml
          cache: false
      - name: clang and lld from the riscv64-sysroot checkout
        working-directory: weft/5-repository/riscv64-sysroot
        run: |
          echo "$PWD/.pixi/envs/default/bin" >> "$GITHUB_PATH"
          .pixi/envs/default/bin/clang++ --print-targets | grep -q riscv64
      - name: persona.elf
        working-directory: weft/3-interactor/taskweft-persona
        run: |
          cmake -S guest -B "$RUNNER_TEMP/rv64" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/weft/5-repository/riscv64-sysroot/toolchain.cmake" \
            -DGUEST_RUNTIME_ROOT="$GITHUB_WORKSPACE/weft/2-contract/guest-runtime" \
            -DLEAN_GUEST_DIR="$GITHUB_WORKSPACE/weft/3-interactor/lean-guest"
          cmake --build "$RUNNER_TEMP/rv64" --target persona
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/rv64/persona" "$RUNNER_TEMP/out/persona.elf"
          cp "$RUNNER_TEMP/siblings.txt" "$RUNNER_TEMP/out/persona.elf.siblings.txt"
      - name: The ELF a double-precision viewer loads, with the persona API
        run: python3 weft/3-interactor/taskweft-persona/tools/check_elf.py "$RUNNER_TEMP/out/persona.elf"
      - name: The check fails on a single-precision ELF (control)
        run: |
          python3 - "$RUNNER_TEMP/out/persona.elf" "$RUNNER_TEMP/single.elf" <<'E'
          import sys
          b = bytearray(open(sys.argv[1], "rb").read())
          i = b.find(b"SBXV(\0\0\0")
          b[i + 4] = 24
          open(sys.argv[2], "wb").write(b)
          E
          if python3 weft/3-interactor/taskweft-persona/tools/check_elf.py "$RUNNER_TEMP/single.elf"; then
            echo "the check passed a 24-byte Variant"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: persona-elf-${{ github.sha }}
          path: ${{ runner.temp }}/out/
