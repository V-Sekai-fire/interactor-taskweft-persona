# pixi manifest for the character domain C-ABI repo.
# Mirrors the RECTGTN domain's pixi.toml: Lean comes from elan (no conda-forge
# build of Lean 4), and `lake build` / `lake exe` are the entry points.
[workspace]
name = "character-domain-c-abi"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[tasks]
build = "lake build"
test = { cmd = "lake exe character_witness", depends-on = ["build"] }
