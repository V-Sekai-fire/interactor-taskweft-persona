name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  mojo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install mojo==1.1.0
      - name: Ladder suite
        run: mojo build -I src tests/test_witness.mojo -o "$RUNNER_TEMP/t" && "$RUNNER_TEMP/t"
      - name: Extended suite
        run: mojo build -I src tests/test_extended.mojo -o "$RUNNER_TEMP/te" && "$RUNNER_TEMP/te"
